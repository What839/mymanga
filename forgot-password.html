<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#f7f9fc;display:grid;place-items:center;min-height:100vh}.card{width:min(420px,92%);background:#fff;padding:26px;border-radius:20px;border:1px solid #e4e9f0}input,button{width:100%;padding:12px;box-sizing:border-box;border-radius:10px}input{border:1px solid #d6dde7;margin:8px 0 14px}button{border:0;background:#70acf4;color:white;font-weight:700}</style></head><body><div class="card"><h1>Forgot Password</h1><label>Email</label><input id="email" type="email" placeholder="Enter email"><button id="reset">Reset password</button><p id="msg"></p></div><script>const sb=supabase.createClient('https://anjwxsqcvhpzoillktmy.supabase.co','');reset.onclick=async()=>{msg.textContent="";const r=await sb.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:location.origin+location.pathname.replace("forgot-password.html","reset-password.html")});msg.textContent=r.error?r.error.message:"Reset link sent. Check your email."}</script></body></html>
