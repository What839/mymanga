<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Manga</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--accent:#70acf4;--text:#444;--muted:#888}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#fff;color:var(--text);font-family:Arial,sans-serif}
.card{width:min(420px,100%);padding:28px;border:1px solid #edf0f5;border-radius:24px;box-shadow:0 10px 35px rgba(0,0,0,.07)}

button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:13px;background:var(--accent);color:#fff;font-weight:700;font-size:16px}

</style></head><body><div class="card"><h1>Forgot password</h1><p>Enter your email and we'll send you a reset link.</p><label>Email</label><input id="email" type="email" placeholder="you@example.com"><button id="send">Send reset link</button><div id="msg" class="msg"></div><p><a href="./">Back to My Manga</a></p><script>
const sb=supabase.createClient("https://anjwxsqcvhpzoillktmy.supabase.co","sb_publishable_pas11tpmdKbIMk8NyOTCRw_O0QAUPnt");
send.onclick=async()=>{msg.style.display="block";const e=email.value.trim();if(!e){msg.textContent="Please enter your email.";return}const r=await sb.auth.resetPasswordForEmail(e,{redirectTo:"https://what839.github.io/mymanga/reset-password.html"});msg.textContent=r.error?r.error.message:"✓ Reset link sent! Check your email.";};
</script></div></body></html>
