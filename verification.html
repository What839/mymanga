<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Manga</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--accent:#70acf4;--text:#444;--muted:#888}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#fff;color:var(--text);font-family:Arial,sans-serif}
.card{width:min(420px,100%);padding:28px;border:1px solid #edf0f5;border-radius:24px;box-shadow:0 10px 35px rgba(0,0,0,.07)}
h1{margin:0 0 8px}p{color:var(--muted);line-height:1.5}label{display:block;margin:18px 0 7px;font-weight:600}
input{width:100%;padding:13px;border:1px solid #dfe4ec;border-radius:13px;font-size:16px}
button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:13px;background:var(--accent);color:#fff;font-weight:700;font-size:16px}
.msg{display:none;margin-top:15px;padding:12px;border-radius:12px;background:#f7f9fc}
a{color:var(--accent)}
.pwWrap{position:relative}.pwWrap input{padding-right:48px}.pwEye{position:absolute;right:6px;top:0;width:auto;margin:0;background:transparent;color:#888;padding:10px}.eyeIcon{display:inline-block;width:19px;height:12px;border:1.8px solid currentColor;border-radius:70% 20% 70% 20%;transform:rotate(45deg);position:relative}.eyeIcon:after{content:"";position:absolute;width:5px;height:5px;border:1.5px solid currentColor;border-radius:50%;left:5px;top:2px}
</style></head><body><div class="card"><h1>Email verification</h1><p id="status">Checking your verification...</p><button onclick="location.href='./'">Return to My Manga</button><script>
const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.slice(1));document.getElementById("status").textContent=(q.get("type")==="signup"||h.get("type")==="signup"||h.get("access_token"))?"✓ You are verified! Your email has been confirmed. You can now return to My Manga and log in.":"Your verification link was opened. You can return to My Manga.";
</script></div></body></html>
