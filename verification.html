<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Manga</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;background:#fbfdff;color:#29486b;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}.card{width:min(420px,100%);background:white;border:1px solid #dcecff;border-radius:22px;padding:26px;box-shadow:0 10px 35px #7caeea25}h1{margin:0 0 8px}p{color:#7690ae;line-height:1.5}label{display:block;margin:15px 0 6px;font-weight:600}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #dcecff;border-radius:12px}button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:13px;background:#70acf4;color:#fff;font-weight:700}.msg{display:none;margin-top:13px;padding:12px;border-radius:12px;background:#e8f3ff}a{color:#70acf4}</style></head><body><div class="card"><h1>Email Verification</h1><p id="s">Checking your verification link...</p><button onclick="location.href='./'">Return to My Manga</button><script>const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.slice(1));document.getElementById("s").textContent=(q.get("type")==="signup"||h.get("type")==="signup"||h.get("access_token"))?"You are verified! Your email has been confirmed.":"Your verification link was opened. You can return to My Manga.";</script></div></body></html>
