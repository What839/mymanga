<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>My Manga</title><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--a:#70acf4;--a2:#e8f3ff;--bg:#fbfdff;--card:#fff;--text:#29486b;--muted:#7690ae;--line:#dcecff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
header{padding:17px 15px 9px;background:var(--card);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:31px;font-weight:600;letter-spacing:-1px;color:var(--a)}
.tools{display:flex;gap:7px}.tool{border:1px solid var(--line);background:var(--card);color:var(--a);border-radius:13px;padding:9px 11px;font-weight:600}
.search{margin-top:12px;width:100%;border:1px solid var(--line);border-radius:16px;padding:12px 15px;background:var(--bg);color:var(--text);outline:0}
.tabs{display:flex;gap:8px;overflow:auto;padding:10px 0 3px}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--a);border-radius:20px;padding:8px 13px;font-weight:600}.tab.active{background:var(--a);color:#fff}
main{padding:14px 12px 100px;max-width:1000px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:9px;box-shadow:0 5px 18px #a9c9e52b;position:relative;min-width:0}.cover{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:11px;background:var(--a2);display:block}
.heart{position:absolute;right:16px;top:16px;width:34px;height:34px;border:0;border-radius:50%;background:#fffffff0;font-size:21px;color:var(--a)}.title{font-size:18px;font-weight:600;margin:10px 3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{display:inline-block;border-radius:20px;padding:5px 9px;background:var(--a2);color:var(--a);font-size:12px;font-weight:600}.meta{font-size:13px;color:var(--muted);margin:4px 3px}.desc{font-size:12px;color:var(--muted);line-height:1.4;margin:8px 3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.linkBtn{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--a2);color:var(--a);display:grid;place-items:center;text-decoration:none;font-size:21px;margin:7px 0 4px 3px}.delete{margin-top:7px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:12px;padding:8px 12px;font-weight:600}
.addCard{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:360px;border:2px dashed var(--a);background:var(--card);color:var(--a);box-shadow:none}.plus{width:56px;height:56px;border-radius:50%;background:var(--a);color:#fff;display:grid;place-items:center;font-size:36px}.addText{font-size:17px;font-weight:600;margin-top:11px}
nav{position:fixed;left:10px;right:10px;bottom:10px;height:64px;border:1px solid var(--line);background:#fffffff5;backdrop-filter:blur(10px);border-radius:30px;display:flex;justify-content:space-around;align-items:center;z-index:5;box-shadow:0 6px 25px #9ec7ef33}.nav{border:0;background:none;color:var(--muted);font-weight:600;font-size:11px;min-width:70px}.nav.active{color:var(--a)}.navIcon{font-size:20px;display:block;margin-bottom:2px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:82px;width:57px;height:57px;border:0;border-radius:50%;background:var(--a);color:#fff;font-size:31px;box-shadow:0 7px 20px #70aaf555;z-index:6}
.modal{display:none;position:fixed;inset:0;background:#183b684d;z-index:20;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-height:92vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:20px 18px 30px}h2{margin:0;color:var(--text);font-weight:600}label{display:block;margin:13px 0 6px;font-size:13px;font-weight:600;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:11px;color:var(--text);outline:0}textarea{min-height:80px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fileBox{display:block;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:11px;color:var(--muted);font-weight:600}.fileBox input{display:none}.preview{width:90px;height:120px;object-fit:cover;border-radius:10px;margin-top:7px;display:none}.actions{display:flex;gap:9px;margin-top:18px}.btn{flex:1;border:0;border-radius:13px;padding:13px;font-weight:600}.cancel{background:var(--a2);color:var(--a)}.save{background:var(--a);color:#fff}
.auth{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;align-items:center;justify-content:center;padding:22px}.auth.open{display:flex}.authbox{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 10px 35px #7caeea25}.authTitle{font-size:34px;color:var(--a);font-weight:600;text-align:center;margin-bottom:4px}.authSub{text-align:center;color:var(--muted);margin-bottom:18px}.authMsg{min-height:20px;color:#d05f78;font-size:13px;margin-top:10px}.authSwitch{border:0;background:none;color:var(--a);font-weight:600;width:100%;margin-top:12px}
.userPill{border:1px solid var(--line);background:var(--a2);color:var(--a);border-radius:20px;padding:7px 10px;font-weight:600;font-size:12px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sectionTitle{font-size:25px;font-weight:600;margin:2px 0 13px}.statBox{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:10px}.statNum{font-size:30px;color:var(--a);font-weight:600}.settingRow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.colorInput{width:48px;height:38px;padding:2px}.logout{border:0;border-radius:12px;background:#ffeaf0;color:#c35c79;padding:11px 14px;font-weight:600}
.verifyBanner{display:none;margin:12px 0 0;padding:13px 15px;border-radius:15px;background:#e8f8ed;border:1px solid #bfe8cb;color:#3f7d53;font-weight:600}.verifyBanner.show{display:block}
.pwWrap{position:relative;display:flex;align-items:center}.pwWrap input{padding-right:48px}.pwEye{position:absolute;right:6px;top:0;width:auto;margin:0;border:0;background:transparent;color:var(--muted);padding:11px}.eyeIcon{display:inline-block;width:19px;height:12px;border:1.8px solid currentColor;border-radius:70% 20% 70% 20%;transform:rotate(45deg);position:relative}.eyeIcon:after{content:'';position:absolute;width:5px;height:5px;border:1.5px solid currentColor;border-radius:50%;left:5px;top:2px}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

.grid .card{padding:7px;border-radius:14px}.grid .cover{border-radius:9px}.grid .title{font-size:13px;margin:7px 2px 4px}.grid .status{font-size:10px;padding:4px 7px}.grid .meta{font-size:10px;margin:3px 2px}.grid .desc{font-size:10px;margin:5px 2px;-webkit-line-clamp:2}.grid .linkBtn{width:30px;height:30px;font-size:16px;margin:5px 0 3px 2px}.grid .delete{font-size:10px;padding:6px 8px;margin-top:4px}.grid .heart{width:28px;height:28px;right:11px;top:11px;font-size:17px}@media(max-width:620px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.grid .card{padding:5px}.grid .title{font-size:11px}.grid .status{font-size:9px}.grid .meta,.grid .desc{font-size:9px}.grid .delete{font-size:9px;padding:5px 6px}}@media(max-width:340px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* ===== Final compact proportional 4-column library ===== */
.libraryGrid,.mangaGrid,.booksGrid{
  grid-template-columns:repeat(4,minmax(0,1fr)) !important;
  gap:8px !important;
}
.mangaCard,.bookCard,.libraryCard{
  padding:6px !important;
  min-height:0 !important;
}
.mangaCard img,.bookCard img,.libraryCard img,.cover{
  aspect-ratio:0.78 !important;
  height:auto !important;
  max-height:none !important;
  border-radius:9px !important;
}
.mangaCard h3,.bookCard h3,.libraryCard h3{
  font-size:12px !important;
  line-height:1.15 !important;
  margin:5px 1px 2px !important;
}
.mangaCard p,.bookCard p,.libraryCard p{
  font-size:10px !important;
  line-height:1.15 !important;
  margin:2px 1px !important;
}
.mangaCard .actions,.bookCard .actions,.libraryCard .actions{
  gap:4px !important;
  margin-top:4px !important;
}
.mangaCard button,.bookCard button,.libraryCard button{
  min-height:27px !important;
  padding:2px 5px !important;
  font-size:10px !important;
}

/* FINAL: three-column proportional library */
.grid{
  display:grid !important;
  grid-template-columns:repeat(3,minmax(0,1fr)) !important;
  gap:9px !important;
}
.card{
  padding:7px !important;
  border-radius:14px !important;
  min-width:0 !important;
}
.cover{
  width:100% !important;
  aspect-ratio:3/4 !important;
  object-fit:cover !important;
  border-radius:9px !important;
}
.title{
  font-size:13px !important;
  line-height:1.15 !important;
  margin:6px 2px 4px !important;
}
.status{
  font-size:10px !important;
  padding:4px 7px !important;
}
.meta{
  font-size:10px !important;
  margin:3px 2px !important;
}
.desc{
  font-size:10px !important;
  line-height:1.25 !important;
  margin:5px 2px !important;
  -webkit-line-clamp:2 !important;
}
.linkBtn{
  width:32px !important;
  height:28px !important;
  font-size:13px !important;
}
.card .heart{
  width:27px !important;
  height:27px !important;
  right:10px !important;
  top:10px !important;
  font-size:17px !important;
}
.card .actions{
  gap:4px !important;
  margin-top:5px !important;
}
.card .actions button{
  min-height:27px !important;
  padding:3px 5px !important;
  font-size:10px !important;
}
@media(max-width:380px){
  .grid{gap:7px !important}
  .card{padding:5px !important}
  .title{font-size:12px !important}
}

.uploadChoices{display:flex;gap:8px}
.uploadChoices .fileBox{flex:1;text-align:center;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:11px;color:var(--muted);font-weight:600;cursor:pointer}
</style></head><body>
<header><div class="top"><div class="brand">My Manga</div><div class="tools"><button class="tool" id="sortBtn">↕ Sort</button><button class="tool" id="filterBtn">♡</button></div></div>
<input id="search" class="search" placeholder="Search your library..."><div class="tabs"><button class="tab active" data-s="All">All</button><button class="tab" data-s="Reading">Reading</button><button class="tab" data-s="Completed">Completed</button><button class="tab" data-s="Want to Read">Want to Read</button><button class="tab" data-s="Favorites">♡ Favorites</button></div></header>
<main><div id="verifyBanner" class="verifyBanner"></div><div id="view"></div></main>
<button class="fab" id="fab">+</button>
<nav><button class="nav active" data-page="library"><span class="navIcon">▤</span>My Library</button><button class="nav" id="navAdd"><span class="navIcon">＋</span>Add</button><button class="nav" data-page="stats"><span class="navIcon">▥</span>Stats</button><button class="nav" data-page="settings"><span class="navIcon">⚙</span>Settings</button></nav>
<div class="modal" id="addModal"><div class="sheet"><h2>Add Manga</h2><label>Manga Name</label><input id="mName" placeholder="Manga name"><div class="row"><div><label>Status</label><select id="mStatus"><option>Reading</option><option>Completed</option><option>Want to Read</option></select></div><div><label>Chapter</label><input id="mChapter" type="number" min="0" value="0"></div></div><label>Link</label><input id="mLink" type="url" placeholder="https://..."><label>Description</label><textarea id="mDesc" placeholder="Description..."></textarea><label>Cover Picture</label>
<div class="uploadChoices">
  <button type="button" class="fileBox" id="chooseGallery">Choose from Gallery</button>
  <button type="button" class="fileBox" id="takePhoto">Take Photo</button>
</div>
<input id="mCover" type="file" accept="image/*" style="display:none">
<input id="mCamera" type="file" accept="image/*" capture="environment" style="display:none"><img id="mPreview" class="preview" loading="lazy" decoding="async"><label>Favorite</label><select id="mFav"><option value="no">No</option><option value="yes">Yes</option></select><div class="actions"><button class="btn cancel" id="cancelAdd">Cancel</button><button class="btn save" id="saveAdd">Add Manga</button></div></div></div>
<div class="modal" id="editModal"><div class="sheet"><h2>Edit Manga</h2><input id="eId" type="hidden"><label>Manga Name</label><input id="eName"><div class="row"><div><label>Status</label><select id="eStatus"><option>Reading</option><option>Completed</option><option>Want to Read</option></select></div><div><label>Chapter</label><input id="eChapter" type="number" min="0"></div></div><label>Link</label><input id="eLink" type="url"><label>Description</label><textarea id="eDesc"></textarea><div class="actions"><button class="btn cancel" id="cancelEdit">Cancel</button><button class="btn save" id="saveEdit">Save Changes</button></div></div></div>
<div class="auth open" id="auth"><div class="authbox"><div class="authTitle">My Manga</div><div class="authSub" id="authSub">Log in to sync your manga library</div><label id="loginLabel">Username or email</label><input id="aEmail" placeholder="Username or email" autocomplete="username"><label id="userLabel" style="display:none">Username</label><input id="aUser" style="display:none" placeholder="Username" autocomplete="username"><label>Password</label><div class="pwWrap"><input id="aPass" type="password" placeholder="Password" autocomplete="current-password"><button type="button" class="pwEye" data-target="aPass"><span class="eyeIcon"></span></button></div><div id="repeatWrap" style="display:none"><label>Repeat password</label><div class="pwWrap"><input id="aPass2" type="password" placeholder="Repeat your password" autocomplete="new-password"><button type="button" class="pwEye" data-target="aPass2"><span class="eyeIcon"></span></button></div></div><div class="authMsg" id="authMsg"></div><button class="btn save" id="authBtn" style="width:100%;margin-top:8px">Log In</button><button class="authSwitch" id="switchAuth">Create an account</button><button class="authSwitch" id="forgot">Forgot password?</button></div></div>
<script>
const SUPABASE_URL="https://anjwxsqcvhpzoillktmy.supabase.co"; const SUPABASE_KEY="sb_publishable_pas11tpmdKbIMk8NyOTCRw_O0QAUPnt";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let session=null,items=[],active="All",page="library",authMode="login";
const $=id=>document.getElementById(id); function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#39;"}[c]))}
function msg(t){$("authMsg").textContent=t}
async function api(path,opts={}){const h=Object.assign({"apikey":SUPABASE_KEY,"Content-Type":"application/json"},opts.headers||{});if(session?.access_token)h.Authorization="Bearer "+session.access_token;const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...opts,headers:h});const text=await r.text();let d=null;try{d=text?JSON.parse(text):null}catch(e){}if(!r.ok)throw new Error(d?.message||d?.hint||text||"Request failed");return d}
async function loadManga(){items=await api("manga?select=*&order=created_at.desc");render()}
async function saveUsername(username){if(!session?.user?.id||!username)return;try{await api("profiles",{method:"POST",headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({id:session.user.id,username})})}catch(e){}}
async function getUsernameByLogin(value){if(value.includes("@"))return value;const rows=await api("profiles?select=id,username&username=eq."+encodeURIComponent(value)+"&limit=1");if(!rows?.[0])throw new Error("Username not found. Try your email instead.");const uid=rows[0].id;const u=await api("profiles?select=username&username=eq."+encodeURIComponent(value)+"&limit=1");return u?.[0]?.username||value}
function render(){const v=$("view");if(page==="stats")return renderStats(v);if(page==="settings")return renderSettings(v);return renderLibrary(v)}
function renderLibrary(v){let q=$("search").value.toLowerCase();let shown=items.filter(x=>active==="All"||x.status===active||(active==="Favorites"&&x.favorite)).filter(x=>x.name.toLowerCase().includes(q));let html='<div class="grid">';shown.forEach(x=>{html+=`<article class="card"><img class="cover" loading="lazy" decoding="async" src="${esc(x.cover_url||"")}" alt=""><button class="heart" onclick="toggleFav('${x.id}')">${x.favorite?"♥":"♡"}</button><div class="title">${esc(x.name)}</div><div class="status">${esc(x.status||"")}</div><div class="meta">Chapter: ${esc(x.chapter||"0")}</div>${x.link?`<a class="linkBtn" href="${esc(x.link)}" target="_blank" rel="noopener">↗</a>`:""}${x.description?`<div class="desc">${esc(x.description)}</div>`:""}<button class="delete" onclick="editManga('${x.id}')">Edit</button> <button class="delete" onclick="deleteManga('${x.id}')">Delete</button></article>`});html+='<button class="card addCard" onclick="openAdd()"><span class="plus">+</span><span class="addText">Add Manga</span></button></div>';v.innerHTML=html}
function renderStats(v){const total=items.length,read=items.filter(x=>x.status==="Reading").length,done=items.filter(x=>x.status==="Completed").length,fav=items.filter(x=>x.favorite).length;v.innerHTML=`<div class="sectionTitle">Statistics</div><div class="statBox"><div class="statNum">${total}</div>Total manga</div><div class="statBox"><div class="statNum">${read}</div>Reading</div><div class="statBox"><div class="statNum">${done}</div>Completed</div><div class="statBox"><div class="statNum">${fav}</div>Favorites</div>`}
async function renderSettings(v){const verified=!!session?.user?.email_confirmed_at;let username=session?.user?.user_metadata?.username||"";try{const p=await api("profiles?select=username&id=eq."+encodeURIComponent(session.user.id));username=p?.[0]?.username||username}catch(e){}v.innerHTML=`<div class="sectionTitle">Settings</div><div class="statBox"><div class="settingRow"><span>Username</span><span class="userPill">@${esc(username||"not set")}</span></div><div class="settingRow"><span>Email</span><span class="userPill">${esc(session?.user?.email||"")}</span></div><div class="settingRow"><span>Email status</span><span class="userPill" style="${verified?"":"color:#b46b2c;background:#fff4e7"}">${verified?"Verified":"Not verified"}</span></div></div><div class="statBox"><div class="settingRow"><span>Appearance</span><select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></div><div class="settingRow"><span>Accent color</span><input id="accent" class="colorInput" type="color" value="${localStorage.getItem("accent")||"#70acf4"}"></div><div style="padding-top:16px;display:flex;gap:8px;flex-wrap:wrap">
<button class="btn save" id="shareLibrary" type="button">Share My Library</button>
<button class="logout" id="logout">Log out</button>
</div></div>`;$("theme").value=localStorage.getItem("theme")||"light";applyTheme($("theme").value);$("theme").onchange=e=>{localStorage.setItem("theme",e.target.value);applyTheme(e.target.value)};$("accent").onchange=e=>{localStorage.setItem("accent",e.target.value);applyAccent(e.target.value)};$("logout").onclick=logout;$("shareLibrary").onclick=shareLibrary}
function applyAccent(c){document.documentElement.style.setProperty("--a",c);document.documentElement.style.setProperty("--a2",hexToRgba(c,.13))}function hexToRgba(h,a){h=h.replace("#","");if(h.length!==6)return "rgba(112,172,244,.13)";let r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return `rgba(${r},${g},${b},${a})`}function applyTheme(t){document.documentElement.style.setProperty("--bg",t==="dark"?"#101720":"#fbfdff");document.documentElement.style.setProperty("--card",t==="dark"?"#182330":"#fff");document.documentElement.style.setProperty("--text",t==="dark"?"#e7f1ff":"#29486b");document.documentElement.style.setProperty("--muted",t==="dark"?"#9db2c9":"#7690ae");document.documentElement.style.setProperty("--line",t==="dark"?"#2a3b4f":"#dcecff")}
function openAdd(){$('addModal').classList.add('open')}function closeAdd(){$('addModal').classList.remove('open')}
async function saveAdd(){const f=$("mCover").files[0],n=$("mName").value.trim();if(!n||!f){alert("Please enter a manga name and choose a cover picture.");return}const reader=new FileReader();reader.onload=async e=>{try{await api("manga",{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify({user_id:session.user.id,name:n,status:$("mStatus").value,chapter:$("mChapter").value||"0",link:$("mLink").value.trim(),description:$("mDesc").value.trim(),cover_url:e.target.result,favorite:$("mFav").value==="yes"})});closeAdd();await loadManga()}catch(err){alert(err.message)}};reader.readAsDataURL(f)}

function encodeSharedLibrary(list){
  const data=list.map(x=>({
    name:x.name||"",
    status:x.status||"",
    chapter:x.chapter||"0",
    link:x.link||"",
    description:x.description||"",
    favorite:!!x.favorite
  }));
  const raw=JSON.stringify(data);
  const bytes=new TextEncoder().encode(raw);
  let bin=""; for(const b of bytes) bin+=String.fromCharCode(b);
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function decodeSharedLibrary(token){
  try{
    const b64=token.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((token.length+3)%4);
    const bin=atob(b64); const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){return null}
}
function renderSharedLibrary(){
  const token=new URLSearchParams(location.hash.slice(1)).get("shared");
  if(!token)return false;
  const data=decodeSharedLibrary(token);
  if(!data)return false;
  $("auth").classList.remove("open");
  $("view").innerHTML=`<div class="sectionTitle">Shared Library</div>
    <div class="statBox" style="margin-bottom:12px">This is a shared copy of a manga list.</div>
    <div class="grid">${data.map(x=>`<article class="card">
      <div style="height:150px;border-radius:9px;background:var(--a2);display:flex;align-items:center;justify-content:center;font-size:38px;color:var(--a)">▤</div>
      <div class="title">${esc(x.name)}</div>
      <div class="status">${esc(x.status)}</div>
      <div class="meta">Chapter: ${esc(x.chapter)}</div>
      ${x.link?`<a class="linkBtn" href="${esc(x.link)}" target="_blank" rel="noopener">↗</a>`:""}
      ${x.description?`<div class="desc">${esc(x.description)}</div>`:""}
    </article>`).join("")}</div>`;
  document.querySelectorAll(".nav").forEach(n=>n.classList.remove("active"));
  return true;
}
async function shareLibrary(){
  if(!items.length){alert("Your library is empty.");return}
  const token=encodeSharedLibrary(items);
  const url=location.origin+location.pathname+"#shared="+token;
  try{
    if(navigator.share){
      await navigator.share({title:"My Manga Library",text:"My Manga Library",url});
    }else{
      await navigator.clipboard.writeText(url);
      alert("Library link copied!");
    }
  }catch(e){
    if(e?.name!=="AbortError"){
      try{await navigator.clipboard.writeText(url);alert("Library link copied!")}
      catch(_){prompt("Copy this library link:",url)}
    }
  }
}

<script>
/* Keep legacy "plan to read" records under the single Want to Read status. */
document.addEventListener("DOMContentLoaded",()=>{
  document.querySelectorAll("select").forEach(sel=>{
    [...sel.options].forEach(o=>{
      if(/plan\s*to\s*read/i.test(o.textContent)||/plan[_-]?to[_-]?read/i.test(o.value)){
        o.textContent="Want to Read"; o.value="want_to_read";
      }
    });
  });
});
</script>

<script>
/* Normalize old status labels without adding duplicate tabs/options. */
(function(){
  const normalize = v => {
    if(!v) return v;
    if(/plan\s*to\s*read/i.test(v) || /want[_-]?to[_-]?read/i.test(v)) return "Want to Read";
    if(/^on\s*hold$/i.test(v)) return "Want to Read";
    return v;
  };
  const oldRender = window.renderLibrary;
  window.normalizeMangaStatus = normalize;
})();
</script>
