<style>

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:82px;width:57px;height:57px;border:0;border-radius:50%;background:var(--a);color:#fff;font-size:31px;box-shadow:0 7px 20px #70aaf555;z-index:6}

.userPill{border:1px solid var(--line);background:var(--a2);color:var(--a);border-radius:20px;padding:7px 10px;font-weight:600;font-size:12px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sectionTitle{font-size:25px;font-weight:600;margin:2px 0 13px}.statBox{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:10px}.statNum{font-size:30px;color:var(--a);font-weight:600}.settingRow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.colorInput{width:48px;height:38px;padding:2px}.logout{border:0;border-radius:12px;background:#ffeaf0;color:#c35c79;padding:11px 14px;font-weight:600}

/* ===== Final compact proportional 4-column library ===== */

}
.mangaCard,.bookCard,.libraryCard{

</style></head><body>
<header><div class="top"><div class="brand">My Manga</div><div class="tools"><button class="tool" id="sortBtn">↕ Sort</button><button class="tool notifyTool" id="notifyBtn" title="Notifications"><span class="bellIcon" aria-label="Notifications"></span><span id="dot" style="display:none;color:var(--a);margin-left:3px">●</span></button><button class="tool" id="filterBtn">♡</button></div></div>

<script>
const SUPABASE_URL="https://anjwxsqcvhpzoillktmy.supabase.co"; const SUPABASE_KEY="sb_publishable_pas11tpmdKbIMk8NyOTCRw_O0QAUPnt";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let session=null,items=[],active="All",page="library",authMode="login",updates=[];
const $=id=>document.getElementById(id); function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#39;"}[c]))}
function msg(t){$("authMsg").textContent=t}
async function api(path,opts={}){const h=Object.assign({"apikey":SUPABASE_KEY,"Content-Type":"application/json"},opts.headers||{});if(session?.access_token)h.Authorization="Bearer "+session.access_token;const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...opts,headers:h});const text=await r.text();let d=null;try{d=text?JSON.parse(text):null}catch(e){}if(!r.ok)throw new Error(d?.message||d?.hint||text||"Request failed");return d}
async function loadManga(){items=await api("manga?select=*&order=created_at.desc");render()}
async function saveUsername(username){if(!session?.user?.id||!username)return;try{await api("profiles",{method:"POST",headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({id:session.user.id,username})})}catch(e){}}
async function getUsernameByLogin(value){if(value.includes("@"))return value;const rows=await api("profiles?select=id,username&username=eq."+encodeURIComponent(value)+"&limit=1");if(!rows?.[0])throw new Error("Username not found. Try your email instead.");const uid=rows[0].id;const u=await api("profiles?select=username&username=eq."+encodeURIComponent(value)+"&limit=1");return u?.[0]?.username||value}

function renderLibrary(v){let q=$("search").value.toLowerCase();let shown=items.filter(x=>active==="All"||x.status===active||(active==="Favorites"&&x.favorite)).filter(x=>x.name.toLowerCase().includes(q));let html='<div class="grid">';shown.forEach(x=>{html+=`<article class="card"><img class="cover" src="${esc(x.cover_url||"")}" alt=""><button class="heart" onclick="toggleFav('${x.id}')">${x.favorite?"♥":"♡"}</button><div class="title">${esc(x.name)}</div><div class="status">${esc(x.status||"")}</div><div class="meta">Chapter: ${esc(x.chapter||"0")}</div>${x.link?`<a class="linkBtn" href="${esc(x.link)}" target="_blank" rel="noopener">↗</a>`:""}${x.description?`<div class="desc">${esc(x.description)}</div>`:""}<button class="delete" onclick="editManga('${x.id}')">Edit</button> <button class="delete" onclick="deleteManga('${x.id}')">Delete</button></article>`});html+='<button class="card addCard" onclick="openAdd()"><span class="plus">+</span><span class="addText">Add Manga</span></button></div>';v.innerHTML=html}

<script>
/* Keep legacy "plan to read" records under the single Want to Read status. */
document.addEventListener("DOMContentLoaded",()=>{
  document.querySelectorAll("select").forEach(sel=>{
    [...sel.options].forEach(o=>{
      if(/plan\s*to\s*read/i.test(o.textContent)||/plan[_-]?to[_-]?read/i.test(o.value)){
        o.textContent="Want to Read"; o.value="want_to_read";
      }
    });
  });
});
</script>

<script>
/* Normalize old status labels without adding duplicate tabs/options. */
(function(){
  const normalize = v => {
    if(!v) return v;
    if(/plan\s*to\s*read/i.test(v) || /want[_-]?to[_-]?read/i.test(v)) return "Want to Read";
    if(/^on\s*hold$/i.test(v)) return "Want to Read";
    return v;
  };
  const oldRender = window.renderLibrary;
  window.normalizeMangaStatus = normalize;
})();
</script>

    const sent=await api("messages?select=receiver_id,created_at&sender_id=eq."+encodeURIComponent(session.user.id)+"&order=created_at.desc&limit=100");
    const received=await api("messages?select=sender_id,created_at&receiver_id=eq."+encodeURIComponent(session.user.id)+"&order=created_at.desc&limit=100");
    const ids=[...(sent||[]).map(x=>x.receiver_id),...(received||[]).map(x=>x.sender_id)].filter(Boolean);
    const unique=[...new Set(ids)];
    if(!unique.length){body.innerHTML="<div class='statBox'>No conversations yet. Search for someone above to start one.</div>";return}
    const profiles=[];
    for(const id of unique){try{const r=await api("profiles?select=id,username,display_name,avatar_url&id=eq."+encodeURIComponent(id)+"&limit=1");if(r?.[0])profiles.push(r[0])}catch(e){}}
    body.innerHTML=profiles.map(p=>`<div class="conv" data-msg-user="${esc2(p.id)}" data-msg-name="${esc2(p.display_name||p.username)}" data-msg-username="${esc2(p.username)}" data-msg-avatar="${esc2(p.avatar_url||"")}"><div class="convAvatar">${p.avatar_url?`<img src="${esc2(p.avatar_url)}">`:esc2((p.display_name||p.username||"?")[0].toUpperCase())}</div><div class="convInfo"><strong>${esc2(p.display_name||p.username)}</strong><small>@${esc2(p.username)}</small></div></div>`).join("");
  }catch(e){body.innerHTML="<div class='statBox'>Messages need the Supabase messages table set up first.</div>";}
}
async function openChatWith(p){
  if(!session?.user?.id)return;
  activeChatUser=p;
  $("msgPanel").classList.add("open");$("chat").classList.add("open");
  $("chatName").textContent=p.display_name||p.username;$("chatUsername").textContent="@"+p.username;
  $("chatAvatar").innerHTML=p.avatar_url?`<img src="${esc2(p.avatar_url)}">`:esc2((p.display_name||p.username||"?")[0].toUpperCase());
  await loadChatMessages();
}
async function loadChatMessages(){
  const box=$("chatMsgs"); if(!box||!activeChatUser)return;
  try{
    const a=await api("messages?select=id,sender_id,receiver_id,body,created_at&or=(and(sender_id.eq."+encodeURIComponent(session.user.id)+",receiver_id.eq."+encodeURIComponent(activeChatUser.id)+"),and(sender_id.eq."+encodeURIComponent(activeChatUser.id)+",receiver_id.eq."+encodeURIComponent(session.user.id)+"))&order=created_at.asc");
    box.innerHTML=(a||[]).map(m=>`<div class="bubble ${m.sender_id===session.user.id?"mine":""}">${esc2(m.body)}</div>`).join("")||"<div class='statBox'>Start the conversation.</div>";
    box.scrollTop=box.scrollHeight;
  }catch(e){box.innerHTML="<div class='statBox'>Messages need the Supabase messages table set up first.</div>";}
}
async function sendChatMessage(){
  const input=$("chatInput"),body=input.value.trim();if(!body||!activeChatUser)return;
  try{await api("messages",{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify({sender_id:session.user.id,receiver_id:activeChatUser.id,body})});input.value="";await loadChatMessages();}catch(e){alert("Couldn't send. The messages table may not be set up yet.");}
}
window.openChatWith=openChatWith;
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-msg-user]");
  if(c) openChatWith({id:c.dataset.msgUser,display_name:c.dataset.msgName,username:c.dataset.msgUsername,avatar_url:c.dataset.msgAvatar});
});
$("fabMsg")?.addEventListener("click",()=>{$("msgPanel").classList.toggle("open");$("chat").classList.remove("open");if($("msgPanel").classList.contains("open"))loadConversations()});
$("msgClose")?.addEventListener("click",()=>$("msgPanel").classList.remove("open"));
$("chatBack")?.addEventListener("click",()=>{$("chat").classList.remove("open");loadConversations()});
$("chatSendBtn")?.addEventListener("click",sendChatMessage);
$("chatInput")?.addEventListener("keydown",e=>{if(e.key==="Enter")sendChatMessage()});
let msgSearchTimer; $("msgUserSearch")?.addEventListener("input",e=>{clearTimeout(msgSearchTimer);msgSearchTimer=setTimeout(()=>searchProfilesForMessage(e.target.value),250)});

document.addEventListener("click",e=>{const b=e.target.closest("[data-page='people']");if(b){e.preventDefault();document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderPeoplePage();return}const p=e.target.closest("[data-profile-name]");if(p){renderPublicProfile(p.dataset.profileName,true)}});
window.addEventListener("popstate",()=>{const m=location.pathname.match(/\/mymanga\/profile\/([^/]+)/);if(m)renderPublicProfile(decodeURIComponent(m[1]),false);else renderPeoplePage()});
document.addEventListener("DOMContentLoaded",()=>{const m=location.pathname.match(/\/mymanga\/profile\/([^/]+)/);if(m)setTimeout(()=>renderPublicProfile(decodeURIComponent(m[1]),false),0)});
})();
</script>
