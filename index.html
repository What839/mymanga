<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Manga</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#70acef;--blue2:#eaf4ff;--ink:#24466a;--muted:#7890a8;--line:#e3edf6;--bg:#fbfdff;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.screen{min-height:100vh}
.authWrap{display:grid;place-items:center;padding:22px}.authCard{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 14px 45px #6b9fd51c}
.brand{font-size:42px;font-weight:800;letter-spacing:-1.8px;color:var(--blue);margin:0 0 7px}.subtitle{color:var(--muted);margin:0 0 22px}
label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}input,textarea,select{width:100%;border:1px solid #d9e6f1;border-radius:15px;background:#fff;color:var(--ink);padding:13px 14px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #70acef1c}
textarea{min-height:95px;resize:vertical}.pw{position:relative}.pw input{padding-right:52px}.eye{position:absolute;right:5px;top:5px;width:40px;height:40px;border:0;background:transparent;color:#6e8ca8}.eyeIcon{display:block;width:19px;height:12px;border:1.8px solid currentColor;border-radius:65% 25% 65% 25%;transform:rotate(45deg);margin:auto;position:relative}.eyeIcon:after{content:"";position:absolute;width:5px;height:5px;border:1.5px solid currentColor;border-radius:50%;left:5px;top:2px}
.primary{width:100%;border:0;background:var(--blue);color:#fff;font-weight:800;border-radius:15px;padding:14px;margin-top:18px}.ghost{border:1px solid var(--line);background:#fff;color:#62819e;border-radius:14px;padding:11px 14px;font-weight:700}.link{display:block;border:0;background:transparent;color:#6a9fd6;padding:11px 0;margin:auto}.msg{min-height:23px;color:#b45555;margin-top:12px}
.app{max-width:1080px;margin:auto;padding:22px 22px 120px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.title{font-size:43px;letter-spacing:-2px;color:var(--blue);margin:0;font-weight:800}.topBtns{display:flex;gap:9px}.round{width:56px;height:56px;border-radius:18px;border:1px solid var(--line);background:#fff;color:#6a91b2;font-size:25px;display:grid;place-items:center}
.search{margin:24px 0 18px}.search input{font-size:25px;padding:18px 22px;border-radius:24px;background:#fff}
.tabs{display:flex;gap:12px;overflow:auto;padding:0 0 17px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#6990af;border-radius:25px;padding:13px 22px;font-weight:800}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:20px}.mangaCard{background:#fff;border:1px solid var(--line);border-radius:24px;padding:15px;box-shadow:0 8px 28px #6b9fd50d}.cover{width:100%;height:285px;border-radius:18px;object-fit:cover;background:#edf5fc;display:block}.coverPlaceholder{height:285px;border-radius:18px;background:var(--blue2);display:grid;place-items:center;color:#82a8c9;font-size:54px}.fav{position:absolute;right:12px;top:12px;width:49px;height:49px;border-radius:50%;border:0;background:#fff;color:#7ba1bf;font-size:28px;box-shadow:0 4px 15px #0001}.coverWrap{position:relative}.mangaName{font-size:25px;font-weight:800;margin:13px 5px 8px}.pill{display:inline-block;background:var(--blue2);color:#6195c9;border-radius:18px;padding:8px 13px;font-weight:800}.meta{color:#708aa2;margin:10px 5px}.cardActions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 5px 3px}.addCard{min-height:440px;border:3px dashed #c8def0;border-radius:24px;background:#fff;display:grid;place-items:center;text-align:center;color:var(--blue);font-weight:800;font-size:25px}.plus{width:105px;height:105px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:62px;font-weight:300;margin:auto}.empty{padding:45px 20px;text-align:center;color:var(--muted)}
.bottom{position:fixed;left:50%;bottom:13px;transform:translateX(-50%);width:min(760px,calc(100% - 28px));background:#fff;border:1px solid var(--line);border-radius:32px;padding:8px;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 10px 35px #6b9fd51f;z-index:20}.nav{border:0;background:transparent;color:#7891a8;padding:9px 4px;border-radius:22px;font-weight:800}.nav.active{color:var(--blue);background:#f1f8ff}.navIcon{display:block;font-size:22px;margin-bottom:4px}.fab{position:fixed;right:28px;bottom:95px;width:76px;height:76px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:48px;box-shadow:0 9px 25px #6b9fd54d;z-index:19}
.modal{position:fixed;inset:0;background:#24466a55;display:none;place-items:center;padding:18px;z-index:50}.modal.open{display:grid}.modalCard{width:min(540px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:25px;padding:23px}.modalHead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#edf5fc;color:#6e91ad;width:40px;height:40px;border-radius:50%;font-size:22px}.modalActions{display:flex;gap:10px;margin-top:17px}.modalActions button{flex:1}
.profileHead{display:flex;gap:16px;align-items:center}.avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;background:var(--blue2);display:grid;place-items:center;font-size:34px;overflow:hidden}.banner{width:100%;height:170px;object-fit:cover;border-radius:20px;background:var(--blue2);margin-bottom:17px}.sectionTitle{font-size:27px;margin:8px 0 16px}.person{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}.person:last-child{border-bottom:0}.person .avatar{width:58px;height:58px;font-size:22px}.tag{display:inline-block;padding:7px 11px;border-radius:18px;background:var(--blue2);color:#6595bd;margin:3px;font-size:13px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;text-align:center}.stat b{display:block;font-size:30px;color:var(--blue)}
@media(max-width:600px){.app{padding:18px 16px 120px}.title{font-size:35px}.grid{grid-template-columns:1fr 1fr;gap:12px}.cover,.coverPlaceholder{height:210px}.mangaName{font-size:20px}.addCard{min-height:350px}.bottom{bottom:8px}.fab{right:20px;bottom:91px;width:66px;height:66px;font-size:40px}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="auth" class="screen authWrap"><div class="authCard">
<h1 class="brand">My Manga ✦</h1><p class="subtitle">Your personal manga library.</p>
<div id="authForm"></div>
</div></div>

<div id="app" class="hidden">
<div class="app">
<div class="top"><h1 class="title">My Manga ✦</h1><div class="topBtns"><button class="ghost" id="sortBtn">↕ Sort</button><button class="round" id="friendTop" title="Friends">♧</button></div></div>
<div class="search"><input id="search" placeholder="Search..."></div>
<div class="tabs" id="tabs">
<button class="tab active" data-status="All">All</button><button class="tab" data-status="Reading">Reading</button><button class="tab" data-status="Completed">Completed</button><button class="tab" data-status="On Hold">On Hold</button><button class="tab" data-status="Dropped">Dropped</button><button class="tab" data-status="Plan to Read">Plan to Read</button>
</div>
<div id="view"></div>
</div>
<button class="fab" id="fab">+</button>
<nav class="bottom">
<button class="nav active" data-page="home"><span class="navIcon">⌂</span>Home</button>
<button class="nav" data-page="library"><span class="navIcon">▤</span>Library</button>
<button class="nav" data-page="add"><span class="navIcon">＋</span>Add</button>
<button class="nav" data-page="stats"><span class="navIcon">▥</span>Stats</button>
<button class="nav" data-page="settings"><span class="navIcon">⚙</span>Settings</button>
</nav>
</div>

<div class="modal" id="mangaModal"><div class="modalCard"><div class="modalHead"><h2 id="mTitle">Add Manga</h2><button class="close" id="closeM">×</button></div>
<label>Title</label><input id="mName" placeholder="Manga title">
<label>Cover image URL</label><input id="mCover" placeholder="https://...">
<label>Status</label><select id="mStatus"><option>Reading</option><option>Completed</option><option>On Hold</option><option>Dropped</option><option>Plan to Read</option></select>
<label>Chapter</label><input id="mChapter" placeholder="01">
<label>Open link</label><input id="mLink" placeholder="https://...">
<label>Notes</label><textarea id="mNotes" placeholder="Your notes..."></textarea>
<div class="modalActions"><button class="ghost" id="cancelM">Cancel</button><button class="primary" id="saveM">Save Manga</button></div>
</div></div>

<div class="modal" id="profileModal"><div class="modalCard"><div class="modalHead"><h2>Customize Profile</h2><button class="close" id="closeP">×</button></div>
<label>Profile picture URL</label><input id="pAvatar" placeholder="https://...">
<label>Thumbnail / banner URL</label><input id="pBanner" placeholder="https://...">
<label>Display name</label><input id="pDisplay">
<label>Username</label><input id="pUsername">
<label>Bio</label><textarea id="pBio"></textarea>
<label>Manga tags</label><input id="pTags" placeholder="Yuri, GL, BL, Romance">
<label>Profile visibility</label><select id="pPublic"><option value="true">Public profile</option><option value="false">Private profile</option></select>
<div class="modalActions"><button class="ghost" id="cancelP">Cancel</button><button class="primary" id="saveP">Save profile</button></div>
</div></div>

<script>
const SUPABASE_URL="https://anjwxsqcvhpzoillktmy.supabase.co";
const SUPABASE_KEY="sb_publishable_pas11tpmdKbIMk8NyOTCRw_O0QAUPnt";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null, profile=null, manga=[], page="home", status="All", editingId=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function notify(t){alert(t)}

function eyeField(id,autocomplete){return `<div class="pw"><input id="${id}" type="password" autocomplete="${autocomplete||"new-password"}"><button type="button" class="eye" data-eye="${id}"><span class="eyeIcon"></span></button></div>`}

function authScreen(mode="login"){
 $("authForm").innerHTML=mode==="login"?`
 <label>Username or email</label><input id="loginId" autocomplete="username">
 <label>Password</label>${eyeField("loginPass","current-password")}
 <div id="authMsg" class="msg"></div><button class="primary" id="authBtn">Login</button>
 <button class="link" id="goSignup">Create an account</button><button class="link" id="goForgot">Forgot password?</button>`
 :`
 <label>Email</label><input id="signupEmail" type="email" autocomplete="email">
 <label>Username</label><input id="signupUsername" autocomplete="username">
 <label>Password</label>${eyeField("signupPass")}
 <label>Repeat password</label>${eyeField("signupPass2")}
 <div id="authMsg" class="msg"></div><button class="primary" id="authBtn">Create account</button>
 <button class="link" id="goLogin">Already have an account? Log in</button>`;
 document.querySelectorAll("[data-eye]").forEach(b=>b.onclick=()=>{let i=$(b.dataset.eye);i.type=i.type==="password"?"text":"password"});
 $("authBtn").onclick=()=>mode==="login"?login():signup();
 if(mode==="login"){$("goSignup").onclick=()=>authScreen("signup");$("goForgot").onclick=()=>location.href="./forgot.html"}else $("goLogin").onclick=()=>authScreen("login");
}

async function login(){
 let id=$("loginId").value.trim(), pass=$("loginPass").value, msg=$("authMsg");msg.textContent="";
 try{
  let email=id;
  if(!id.includes("@")){
   const {data,error}=await sb.from("profiles").select("email").eq("username",id).maybeSingle();
   if(error||!data?.email) throw Error("Username not found.");
   email=data.email;
  }
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error)throw error;
  user=data.user;await loadProfile();await loadManga();showApp();
 }catch(e){msg.textContent=e.message||"Login failed."}
}
async function signup(){
 let email=$("signupEmail").value.trim(),username=$("signupUsername").value.trim(),pass=$("signupPass").value,msg=$("authMsg");msg.textContent="";
 if(!email||!username||!pass)return msg.textContent="Please fill in all fields.";
 if(pass!==$("signupPass2").value)return msg.textContent="Passwords do not match.";
 if(username.length<3)return msg.textContent="Username must be at least 3 characters.";
 try{
  const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{username},emailRedirectTo:location.origin+location.pathname.replace(/\/?$/,"/verification.html")}});
  if(error)throw error;
  if(data.user){
   await sb.from("profiles").upsert({id:data.user.id,email,username,display_name:username,bio:"",tags:[],is_public:true});
  }
  if(data.session){user=data.user;await loadProfile();showApp()}else msg.textContent="Account created. Check your email to verify it.";
 }catch(e){msg.textContent=e.message||"Sign up failed."}
}

async function loadProfile(){
 const {data,error}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
 if(error)console.warn(error);
 profile=data||{id:user.id,email:user.email,username:user.user_metadata?.username||"",display_name:user.user_metadata?.username||"",bio:"",tags:[],is_public:true};
}
async function loadManga(){
 const {data,error}=await sb.from("manga").select("*").eq("user_id",user.id).order("created_at",{ascending:false});
 if(error){console.warn(error);manga=[]}else manga=data||[];
}
function showApp(){$("auth").classList.add("hidden");$("app").classList.remove("hidden");render()}
function render(){
 document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.page===page));
 if(page==="settings")return settingsPage();
 if(page==="stats")return statsPage();
 if(page==="library")return libraryPage();
 if(page==="friends")return friendsPage();
 if(page==="profile")return profilePage();
 return homePage();
}
function filtered(){
 let q=$("search").value.trim().toLowerCase();
 return manga.filter(m=>(status==="All"||m.status===status)&&(!q||String(m.title).toLowerCase().includes(q)));
}
function homePage(){
 $("view").innerHTML=`<div class="grid" id="mGrid"></div>`;
 drawManga(filtered(),true);
}
function libraryPage(){
 $("view").innerHTML=`<div class="grid" id="mGrid"></div>`;
 drawManga(filtered(),false);
}
function drawManga(list,addCard){
 let html=list.map(m=>`<article class="mangaCard"><div class="coverWrap">${m.cover_url?`<img class="cover" src="${esc(m.cover_url)}" alt="">`:`<div class="coverPlaceholder">＋</div>`}<button class="fav" data-fav="${m.id}">${m.favorite?"♥":"♡"}</button></div><div class="mangaName">${esc(m.title)}</div><span class="pill">${esc(m.status)}</span><div class="meta">Chapter: ${esc(m.chapter||"—")}</div>${m.link?`<div class="meta"><a href="${esc(m.link)}" target="_blank" rel="noopener">↗ Open link</a></div>`:""}${m.notes?`<div class="meta">${esc(m.notes)}</div>`:""}<div class="cardActions"><button class="ghost" data-edit="${m.id}">Edit</button><button class="ghost" data-delete="${m.id}">Delete</button></div></article>`).join("");
 if(addCard)html+=`<button class="addCard" id="addCard"><div><div class="plus">+</div><div style="margin-top:16px">Add Manga</div></div></button>`;
 $("mGrid").innerHTML=html||(!addCard?`<div class="empty">Your library is empty. Add your first manga.</div>`:`<button class="addCard" id="addCard"><div><div class="plus">+</div><div style="margin-top:16px">Add Manga</div></div></button>`);
 $("addCard")?.addEventListener("click",openManga);
 document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>toggleFav(b.dataset.fav));
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openManga(b.dataset.edit));
 document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>deleteManga(b.dataset.delete));
}
function openManga(id=null){
 editingId=id;
 $("mTitle").textContent=id?"Edit Manga":"Add Manga";
 let m=id?manga.find(x=>String(x.id)===String(id)):null;
 $("mName").value=m?.title||"";$("mCover").value=m?.cover_url||"";$("mStatus").value=m?.status||"Reading";$("mChapter").value=m?.chapter||"";$("mLink").value=m?.link||"";$("mNotes").value=m?.notes||"";
 $("mangaModal").classList.add("open");
}
async function saveManga(){
 let body={user_id:user.id,title:$("mName").value.trim(),cover_url:$("mCover").value.trim()||null,status:$("mStatus").value,chapter:$("mChapter").value.trim(),link:$("mLink").value.trim()||null,notes:$("mNotes").value.trim()};
 if(!body.title)return notify("Please enter a title.");
 let r=editingId?await sb.from("manga").update(body).eq("id",editingId).eq("user_id",user.id):await sb.from("manga").insert(body);
 if(r.error)return notify(r.error.message);
 $("mangaModal").classList.remove("open");await loadManga();render();
}
async function deleteManga(id){if(!confirm("Delete this manga?"))return;const r=await sb.from("manga").delete().eq("id",id).eq("user_id",user.id);if(r.error)return notify(r.error.message);await loadManga();render()}
async function toggleFav(id){let m=manga.find(x=>String(x.id)===String(id));if(!m)return;const r=await sb.from("manga").update({favorite:!m.favorite}).eq("id",id).eq("user_id",user.id);if(r.error)return notify(r.error.message);await loadManga();render()}

function statsPage(){
 let counts={Reading:0,Completed:0,"On Hold":0,Dropped:0,"Plan to Read":0};manga.forEach(m=>counts[m.status]=(counts[m.status]||0)+1);
 $("view").innerHTML=`<h2 class="sectionTitle">Your Stats</h2><div class="stats"><div class="stat"><b>${manga.length}</b>Total</div><div class="stat"><b>${counts.Reading}</b>Reading</div><div class="stat"><b>${counts.Completed}</b>Completed</div><div class="stat"><b>${counts["On Hold"]}</b>On Hold</div><div class="stat"><b>${counts.Dropped}</b>Dropped</div><div class="stat"><b>${counts["Plan to Read"]}</b>Plan to Read</div></div>`;
}
function settingsPage(){
 $("view").innerHTML=`<div class="card"><h2 class="sectionTitle">Settings</h2><p><b>Username</b><br>@${esc(profile?.username||"not set")}</p><p><b>Email</b><br>${esc(user.email)}</p><p><b>Profile</b><br>${profile?.is_public===false?"Private":"Public"}</p><div class="cardActions"><button class="ghost" id="profileBtn">Customize profile</button><button class="ghost" id="friendsBtn">Friends</button><button class="ghost" id="logoutBtn">Log out</button></div></div>`;
 $("profileBtn").onclick=()=>{page="profile";render()};$("friendsBtn").onclick=()=>{page="friends";render()};$("logoutBtn").onclick=logout;
}
function profilePage(){
 let p=profile||{};$("view").innerHTML=`<div class="card">${p.banner_url?`<img class="banner" src="${esc(p.banner_url)}">`:""}<div class="profileHead"><div class="avatar">${p.avatar_url?`<img class="avatar" src="${esc(p.avatar_url)}">`:"♡"}</div><div><h2 style="margin:0">${esc(p.display_name||p.username||"My Profile")}</h2><div class="muted">@${esc(p.username||"not set")}</div></div></div><p>${esc(p.bio||"No bio yet.")}</p><div>${(p.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div><p class="muted">${p.is_public===false?"Private profile":"Public profile"}</p><button class="primary" id="editProfile">Customize profile</button></div>`;
 $("editProfile").onclick=()=>openProfile();
}
function openProfile(){
 let p=profile||{};$("pAvatar").value=p.avatar_url||"";$("pBanner").value=p.banner_url||"";$("pDisplay").value=p.display_name||"";$("pUsername").value=p.username||"";$("pBio").value=p.bio||"";$("pTags").value=(p.tags||[]).join(", ");$("pPublic").value=String(p.is_public!==false);$("profileModal").classList.add("open");
}
async function saveProfile(){
 let username=$("pUsername").value.trim();if(!username)return notify("Username is required.");
 let body={avatar_url:$("pAvatar").value.trim()||null,banner_url:$("pBanner").value.trim()||null,display_name:$("pDisplay").value.trim()||username,username,bio:$("pBio").value.trim(),tags:$("pTags").value.split(",").map(x=>x.trim()).filter(Boolean),is_public:$("pPublic").value==="true"};
 const r=await sb.from("profiles").update(body).eq("id",user.id);if(r.error)return notify(r.error.message);await loadProfile();$("profileModal").classList.remove("open");page="profile";render();
}
async function friendsPage(){
 $("view").innerHTML=`<div class="card"><h2 class="sectionTitle">Friends</h2><button class="primary" id="explorePeople">Explore people</button><div id="friendList"><p class="muted">Loading...</p></div></div>`;
 const {data,error}=await sb.from("friend_requests").select("sender_id,receiver_id").or(`sender_id.eq.${user.id},receiver_id.eq.${user.id}`).eq("status","accepted");
 if(error)return $("friendList").innerHTML=`<p class="msg">${esc(error.message)}</p>`;
 let ids=(data||[]).map(x=>x.sender_id===user.id?x.receiver_id:x.sender_id);
 if(!ids.length)$("friendList").innerHTML="<p class='muted'>No friends yet. Explore people to add some.</p>";
 else{const r=await sb.from("profiles").select("username,display_name,avatar_url").in("id",ids);$("friendList").innerHTML=(r.data||[]).map(p=>`<div class="person"><div class="avatar">${p.avatar_url?`<img class="avatar" src="${esc(p.avatar_url)}">`:"♡"}</div><div><b>${esc(p.display_name||p.username)}</b><div class="muted">@${esc(p.username)}</div></div></div>`).join("")}
 $("explorePeople").onclick=explorePeople;
}
async function explorePeople(){
 $("view").innerHTML=`<div class="card"><h2 class="sectionTitle">Explore People</h2><input id="peopleSearch" placeholder="Search username"><div id="peopleList"></div></div>`;
 const load=async()=>{let q=$("peopleSearch").value.trim();let req=sb.from("profiles").select("id,username,display_name,bio,avatar_url,tags,is_public").eq("is_public",true).neq("id",user.id).limit(30);if(q)req=req.ilike("username","%"+q+"%");let r=await req;if(r.error)return $("peopleList").textContent=r.error.message;$("peopleList").innerHTML=(r.data||[]).map(p=>`<div class="person"><div class="avatar">${p.avatar_url?`<img class="avatar" src="${esc(p.avatar_url)}">`:"♡"}</div><div style="flex:1"><b>${esc(p.display_name||p.username)}</b><div class="muted">@${esc(p.username)}</div><div>${(p.tags||[]).slice(0,4).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div></div><button class="ghost" data-add="${p.id}">Add friend</button></div>`).join("")||"<p class='muted'>No people found.</p>";document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>sendFriend(b.dataset.add))};
 $("peopleSearch").oninput=load;await load();
}
async function sendFriend(id){const r=await sb.from("friend_requests").upsert({sender_id:user.id,receiver_id:id,status:"pending"},{onConflict:"sender_id,receiver_id"});notify(r.error?r.error.message:"Friend request sent.")}
function addPage(){$("mangaModal").classList.add("open")}
async function logout(){await sb.auth.signOut();user=null;profile=null;manga=[];$("app").classList.add("hidden");$("auth").classList.remove("hidden");authScreen("login")}
$("search").oninput=render;
$("sortBtn").onclick=()=>{manga.sort((a,b)=>String(a.title).localeCompare(String(b.title)));render()};
$("fab").onclick=()=>openManga();
$("friendTop").onclick=()=>{page="friends";render()};
$("closeM").onclick=$("cancelM").onclick=()=>{$("mangaModal").classList.remove("open")};
$("saveM").onclick=saveManga;
$("closeP").onclick=$("cancelP").onclick=()=>{$("profileModal").classList.remove("open")};
$("saveP").onclick=saveProfile;
document.querySelectorAll(".nav").forEach(n=>n.onclick=()=>{page=n.dataset.page;if(page==="add")return openManga();render()});
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{status=t.dataset.status;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===t));render()});

(async()=>{
 try{
  if(!window.supabase)throw Error("Supabase library did not load.");
  const {data}=await sb.auth.getSession();
  if(data.session){user=data.session.user;await loadProfile();await loadManga();showApp()}else authScreen("login");
  sb.auth.onAuthStateChange(async(_e,s)=>{if(s&&!user){user=s.user;await loadProfile();await loadManga();showApp()}});
 }catch(e){$("authForm").innerHTML=`<p class="msg">${esc(e.message)}</p><button class="primary" onclick="location.reload()">Reload</button>`}
})();
</script>
</body>
</html>
