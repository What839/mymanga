<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Manga</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;display:grid;place-items:center;min-height:100vh;background:#f7f9fc}.card{width:min(420px,92%);background:#fff;padding:28px;border-radius:20px;border:1px solid #e5eaf0}input{width:100%;padding:12px;box-sizing:border-box;border:1px solid #d8dee8;border-radius:10px;margin:8px 0 15px}button{width:100%;padding:12px;border:0;border-radius:10px;background:#70acf4;color:#fff;font-weight:700}</style></head><body><div class="card"><h1>Reset Password</h1><label>New password</label><input id="p" type="password"><label>Repeat password</label><input id="p2" type="password"><button id="save">Update password</button><p id="msg"></p><script>const sb=supabase.createClient('https://anjwxsqcvhpzoillktmy.supabase.co','');save.onclick=async()=>{if(p.value!==p2.value){msg.textContent="Passwords do not match.";return}const r=await sb.auth.updateUser({password:p.value});msg.textContent=r.error?r.error.message:"Password updated successfully."}</script></div></body></html>
