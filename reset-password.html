<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#f7f9fc;display:grid;place-items:center;min-height:100vh}.card{width:min(420px,92%);background:#fff;padding:26px;border-radius:20px;border:1px solid #e4e9f0}input,button{width:100%;padding:12px;box-sizing:border-box;border-radius:10px}input{border:1px solid #d6dde7;margin:8px 0 14px}button{border:0;background:#70acf4;color:white;font-weight:700}</style></head><body><div class="card"><h1>Reset Password</h1><label>New password</label><input id="p" type="password"><label>Repeat password</label><input id="p2" type="password"><button id="save">Update password</button><p id="msg"></p></div><script>const sb=supabase.createClient('https://anjwxsqcvhpzoillktmy.supabase.co','');save.onclick=async()=>{if(p.value!==p2.value)return msg.textContent="Passwords do not match.";const r=await sb.auth.updateUser({password:p.value});msg.textContent=r.error?r.error.message:"Password updated successfully.";}</script></body></html>
